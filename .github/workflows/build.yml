name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 patchelf libffi-dev libssl-dev
        pip install --upgrade pip buildozer cython==0.29.36 virtualenv

    - name: Accept Android SDK licenses and Build
      run: |
        # Автоматическое принятие лицензий Android SDK для предотвращения ошибки Aidl
        mkdir -p ~/.android
        keytool -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -genkey -v -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        
        # Запуск сборки
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk