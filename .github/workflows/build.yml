name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libncurses5:i386 \
          libstdc++6:i386 \
          libz1:i386 \
          unzip \
          ant

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Pre-install Android SDK and Accept Licenses
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME
        sdkmanager --sdk_root=$ANDROID_HOME --install "platforms;android-33" "build-tools;33.0.0" "platform-tools" || true
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
